name: MySQL schema integration test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mysql-schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: site_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l tests/mysql-schema-smoke.php
          php -l php/database.php
          php -l php/app.php
      - name: Create schema and verify tables and foreign keys
        env:
          C8B_DB_HOST: 127.0.0.1
          C8B_DB_PORT: 3306
          C8B_DB_DATABASE: site_test
          C8B_DB_USERNAME: root
          C8B_DB_PASSWORD: root
        run: php tests/mysql-schema-smoke.php
