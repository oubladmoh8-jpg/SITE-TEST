name: MySQL schema integration test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mysql-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and start MySQL server
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server
          sudo systemctl start mysql
          sudo mysql -e "CREATE DATABASE site_test;"
          sudo mysql -e "CREATE USER 'site_test'@'127.0.0.1' IDENTIFIED BY 'root';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON site_test.* TO 'site_test'@'127.0.0.1';"
      - name: Set up PHP with MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l tests/mysql-schema-smoke.php
          php -l php/database.php
          php -l php/app.php
      - name: Create schema and verify tables and foreign keys
        env:
          C8B_DB_HOST: 127.0.0.1
          C8B_DB_PORT: 3306
          C8B_DB_DATABASE: site_test
          C8B_DB_USERNAME: site_test
          C8B_DB_PASSWORD: root
        run: php tests/mysql-schema-smoke.php
