name: SQLite file database test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sqlite-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with SQLite driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l tests/mysql-schema-smoke.php
          php -l php/database.php
          php -l php/app.php
      - name: Create schema and verify tables and foreign keys
        run: php tests/mysql-schema-smoke.php
